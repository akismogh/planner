<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Claude-themed favicon: warm coral background with a white burst,
       evocative of Anthropic's brand palette without copying the trademark
       logomark exactly. -->
  <rect width="64" height="64" rx="14" fill="#CC785C"/>
  <g fill="#FFFFFF">
    <rect x="29" y="10" width="6" height="44" rx="3"/>
    <rect x="10" y="29" width="44" height="6" rx="3"/>
    <g transform="rotate(45 32 32)">
      <rect x="29" y="10" width="6" height="44" rx="3"/>
      <rect x="10" y="29" width="44" height="6" rx="3"/>
    </g>
  </g>
</svg>
